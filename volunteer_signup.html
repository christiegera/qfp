<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Sign Up · Quakertown Food Pantry</title>
<style>
  :root{
    --orange:#fd7f54; --orange-deep:#f97316; --ink:#1f2937; --ink-soft:#6b7280;
    --line:#e5e7eb; --paper:#f8f9fa; --paper-2:#ffffff;
    --green:#059669; --green-light:#10b981; --blue:#3b82f6; --blue-deep:#1d4ed8;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);background:linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%);color:var(--ink);padding-bottom:160px;}

  .hero{background:linear-gradient(135deg,var(--orange) 0%,var(--orange-deep) 100%);color:#fff;padding:30px 20px;text-align:center;box-shadow:0 4px 20px rgba(253,127,84,.3);}
  .hero h1{font-size:clamp(1.6em,4vw,2.3em);font-weight:700;margin-bottom:6px;}
  .hero p{font-size:1.05em;opacity:.95;}

  .container{max-width:1200px;margin:0 auto;padding:22px 16px;}

  .banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:11px 14px;font-size:.85em;margin-bottom:18px;text-align:center;}

  .monthbar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px;}
  .monthbar h2{font-size:1.25em;font-weight:700;color:var(--ink);min-width:220px;text-align:center;}
  .navbtn{background:#fff;border:2px solid var(--line);border-radius:10px;width:46px;height:46px;font-size:1.3em;font-weight:700;color:var(--ink);cursor:pointer;transition:all .2s;line-height:1;}
  .navbtn:hover:not(:disabled){border-color:var(--orange);color:var(--orange);}
  .navbtn:disabled{opacity:.35;cursor:default;}

  .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;font-size:.78em;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .dot.open{background:#fff;border:2px solid var(--green);}
  .dot.sel{background:var(--orange);}
  .dot.full{background:#e5e7eb;}
  .dot.grp{background:var(--blue);}

  .weekhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:8px;}
  .weekhead div{text-align:center;font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}

  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;}
  .cell{background:var(--paper-2);border:2px solid var(--line);border-radius:10px;min-height:168px;padding:8px;display:flex;flex-direction:column;position:relative;}
  .cell.blank{background:transparent;border:none;}
  .cell.weekend{background:#fafafa;border-style:dashed;opacity:.5;}
  .daynum{font-size:1.05em;font-weight:700;color:var(--ink);margin-bottom:3px;}
  .cell.shift{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;}
  .cell.shift:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.1);border-color:var(--orange);}
  .cell.selected{border-color:var(--orange);background:#fff7f3;box-shadow:0 0 0 2px rgba(253,127,84,.25);}
  .cell.full{cursor:default;background:#f9fafb;opacity:.72;}
  .cell.full:hover{transform:none;box-shadow:none;border-color:var(--line);}
  .cell.group{cursor:default;border-color:var(--blue);background:#eff6ff;}
  .cell.group:hover{transform:none;box-shadow:none;border-color:var(--blue);}

  .time{font-size:.74em;font-weight:600;color:var(--orange-deep);margin-bottom:6px;}
  .roster{display:flex;flex-direction:column;gap:2px;}
  .slot{font-size:.7em;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slot.filled{color:var(--green);font-weight:600;}
  .slot.open{color:var(--ink-soft);}
  .slot.group{color:var(--blue);font-weight:600;white-space:normal;}
  .avail{margin-top:4px;font-size:.72em;font-weight:700;}
  .avail.ok{color:var(--green);}
  .avail.low{color:#d97706;}
  .avail.none{color:var(--ink-soft);}
  .sup{font-size:.68em;color:var(--ink-soft);margin-top:auto;padding-top:5px;line-height:1.3;}
  .check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-size:.8em;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1;}
  .cell.selected .check{display:flex;}
  .pill{display:inline-block;font-size:.6em;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:20px;background:#eff6ff;color:var(--blue);margin-top:4px;}

  .loading,.error{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:1.05em;}
  .error{color:#dc2626;}

  /* Signup tray */
  .tray{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.12);transform:translateY(110%);transition:transform .25s ease;z-index:900;}
  .tray.open{transform:translateY(0);}
  .tray-inner{max-width:1200px;margin:0 auto;padding:16px;}
  .tray-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .tray-count{font-weight:700;font-size:1.05em;}
  .tray-count span{color:var(--orange-deep);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;max-height:72px;overflow:auto;}
  .chip{background:#fff7f3;border:1px solid var(--orange);color:var(--orange-deep);border-radius:20px;padding:4px 10px;font-size:.76em;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .chip b{cursor:pointer;font-size:1.1em;line-height:1;}
  .fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px;}
  @media(max-width:720px){.fields{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .fields input{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:9px;font-size:.95em;font-family:inherit;}
  .fields input:focus{outline:none;border-color:var(--orange);}
  .submit{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--green-light) 0%,var(--green) 100%);color:#fff;font-size:1.05em;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 3px 10px rgba(16,185,129,.3);transition:transform .15s;}
  .submit:hover:not(:disabled){transform:translateY(-1px);}
  .submit:disabled{opacity:.6;cursor:default;}
  .formnote{font-size:.72em;color:var(--ink-soft);text-align:center;margin-top:8px;}

  /* Success overlay */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:20px;}
  .overlay.open{display:flex;}
  .success{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:34px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .success .big{font-size:3em;margin-bottom:10px;}
  .success h3{font-size:1.4em;color:var(--ink);margin-bottom:10px;}
  .success p{color:var(--ink-soft);font-size:.95em;line-height:1.55;margin-bottom:20px;}
  .success button{padding:12px 26px;border:none;border-radius:10px;background:var(--orange);color:#fff;font-weight:700;font-family:inherit;font-size:1em;cursor:pointer;}

  @media(max-width:640px){
    .grid,.weekhead{gap:4px;}
    .cell{min-height:92px;padding:5px;border-radius:7px;}
    .sup{display:none;}
    .daynum{font-size:.9em;}
  }
</style>
</head>
<body>
  <div class="hero">
    <h1>&#x1F955; Quakertown Food Pantry</h1>
    <p>Volunteer Sign Up &#8212; tap the days you can help, then add your details</p>
  </div>

  <div class="container">
    <div id="banner" class="banner" style="display:none;"></div>

    <div class="monthbar">
      <button class="navbtn" id="prevBtn" aria-label="Previous month">&#8249;</button>
      <h2 id="monthLabel">Loading&#8230;</h2>
      <button class="navbtn" id="nextBtn" aria-label="Next month">&#8250;</button>
    </div>

    <div class="legend">
      <span><i class="dot open"></i> Open</span>
      <span><i class="dot sel"></i> Selected</span>
      <span><i class="dot full"></i> Full</span>
      <span><i class="dot grp"></i> Group day</span>
    </div>

    <div class="weekhead">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="grid" class="grid"><div class="loading" style="grid-column:1/-1;">Loading volunteer shifts&#8230;</div></div>
  </div>

  <!-- Signup tray -->
  <div class="tray" id="tray">
    <div class="tray-inner">
      <div class="tray-top">
        <div class="tray-count"><span id="trayCount">0</span> shift<span id="trayPlural">s</span> selected</div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="fields">
        <input type="text" id="fFirst" placeholder="First name" autocomplete="given-name">
        <input type="text" id="fLast" placeholder="Last name" autocomplete="family-name">
        <input type="email" id="fEmail" placeholder="Email" autocomplete="email">
        <input type="tel" id="fPhone" placeholder="Phone" autocomplete="tel">
      </div>
      <button class="submit" id="submitBtn">Sign me up</button>
      <div class="formnote" id="formNote">You'll get a confirmation email for each shift.</div>
    </div>
  </div>

  <!-- Success overlay -->
  <div class="overlay" id="overlay">
    <div class="success">
      <div class="big">&#x1F389;</div>
      <h3>You're signed up!</h3>
      <p id="successMsg"></p>
      <button id="successClose">Done</button>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var SPREADSHEET_ID = '1q1S4UHYOxME7j8E0EQmKNHh_P3ldmvk3YfeAqlLmGug';
  var SUPERVISORS_GID = '502386465';
  var SIGNUPS_GID = '1435555973';
  var FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSe1bebeMjCP6pak7I2EJlCQ7fbFJ6DDCYrsj8xxI9JzW2L7Lg/formResponse';
  var E = { first:'entry.871319408', last:'entry.1622497140', email:'entry.1333360871', phone:'entry.747210424', date:'entry.579980168' };
  var MAX_SLOTS = 5;

  var supervisorsData = [], signupsData = [], shiftsByKey = {}, months = [], monthIdx = 0;
  var selected = {};

  var grid = document.getElementById('grid');
  var monthLabel = document.getElementById('monthLabel');
  var tray = document.getElementById('tray');
  var overlay = document.getElementById('overlay');

  function csvUrl(gid){ return 'https://docs.google.com/spreadsheets/d/'+SPREADSHEET_ID+'/export?format=csv&gid='+gid; }

  function loadData(){
    Promise.all([
      fetch(csvUrl(SUPERVISORS_GID)).then(function(r){ if(!r.ok) throw 0; return r.text(); }),
      fetch(csvUrl(SIGNUPS_GID)).then(function(r){ if(!r.ok) throw 0; return r.text(); })
    ]).then(function(res){
      supervisorsData = parseCSV(res[0]);
      signupsData = parseCSV(res[1]);
      init();
    }).catch(function(){
      useSample();
      init();
    });
  }

  function parseCSV(text){
    var rows=[], row=[], cur='', q=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
        else cur+=c;
      } else {
        if(c==='"') q=true;
        else if(c===','){ row.push(cur); cur=''; }
        else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=''; }
        else cur+=c;
      }
    }
    if(cur!==''||row.length){ row.push(cur); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(c){ return (c||'').trim(); }); });
  }

  var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function dayName(d){ return DAYS[d.getDay()]; }
  function shiftTime(day){ return (day==='Tuesday'||day==='Thursday')?'6:00 – 8:00 PM':'10:00 AM – 1:00 PM'; }
  function weekNum(d){ return (['1st','2nd','3rd','4th','5th'])[Math.ceil(d.getDate()/7)-1]||'5th'; }
  function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  function findSupervisor(day,wk){
    for(var i=1;i<supervisorsData.length;i++){
      var r=supervisorsData[i];
      if(r[0]===day||r[0]===wk+' '+day) return {name:(r[2]||'TBD').trim(),phone:(r[3]||'').trim(),email:(r[4]||'').trim()};
    }
    return {name:'TBD',phone:'',email:''};
  }
  function groupName(day,wk){
    for(var i=1;i<supervisorsData.length;i++){
      var r=supervisorsData[i];
      if((r[0]===day||r[0]===wk+' '+day)&&r[1]&&r[1].trim()&&r[1].trim()!=='NA') return r[1].trim();
    }
    return false;
  }

  function buildShifts(){
    shiftsByKey={};
    var today=new Date(); today.setHours(0,0,0,0);
    var end=new Date(today); end.setDate(today.getDate()+84);
    for(var d=new Date(today); d<=end; d.setDate(d.getDate()+1)){
      var wd=d.getDay(); if(wd===0||wd===6) continue;
      var c=new Date(d), dn=dayName(c), wk=weekNum(c);
      shiftsByKey[keyOf(c)]={ key:keyOf(c), date:new Date(c), day:dn, time:shiftTime(dn),
        supervisor:findSupervisor(dn,wk), group:groupName(dn,wk), volunteers:[] };
    }
    for(var i=1;i<signupsData.length;i++){
      var row=signupsData[i]; if(!row[5]) continue;
      if((row[7]||'').trim()==='Cancelled') continue;
      var sd=new Date(row[5]); if(isNaN(sd)) continue;
      var k=keyOf(sd);
      if(shiftsByKey[k]) shiftsByKey[k].volunteers.push((row[1]||'')+' '+((row[2]||'').charAt(0))+'.');
    }
  }

  function buildMonths(){
    var seen={}; months=[];
    Object.keys(shiftsByKey).sort().forEach(function(k){
      var d=shiftsByKey[k].date, mk=d.getFullYear()+'-'+d.getMonth();
      if(!seen[mk]){ seen[mk]=true; months.push({y:d.getFullYear(),m:d.getMonth()}); }
    });
    var now=new Date();
    monthIdx=0;
    for(var i=0;i<months.length;i++){ if(months[i].y===now.getFullYear()&&months[i].m===now.getMonth()){ monthIdx=i; break; } }
  }

  function render(){
    var mo=months[monthIdx];
    monthLabel.textContent=new Date(mo.y,mo.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    document.getElementById('prevBtn').disabled=(monthIdx===0);
    document.getElementById('nextBtn').disabled=(monthIdx===months.length-1);

    var first=new Date(mo.y,mo.m,1), startDay=first.getDay(), daysIn=new Date(mo.y,mo.m+1,0).getDate();
    var html='';
    for(var b=0;b<startDay;b++) html+='<div class="cell blank"></div>';
    var today=new Date(); today.setHours(0,0,0,0);
    for(var dd=1;dd<=daysIn;dd++){
      var d=new Date(mo.y,mo.m,dd), wd=d.getDay(), k=keyOf(d), shift=shiftsByKey[k];
      if(wd===0||wd===6){ html+='<div class="cell weekend"><div class="daynum">'+dd+'</div></div>'; continue; }
      if(!shift||d<today){ html+='<div class="cell"><div class="daynum" style="color:#cbd5e1">'+dd+'</div></div>'; continue; }
      var filled=shift.volunteers.length, isFull=filled>=MAX_SLOTS, isGroup=!!shift.group, isSel=!!selected[k];
      var cls='cell shift'+(isGroup?' group':'')+(isFull&&!isGroup?' full':'')+(isSel?' selected':'');
      html+='<div class="'+cls+'" data-key="'+k+'">';
      html+='<div class="check">&#10003;</div>';
      html+='<div class="daynum">'+dd+'</div>';
      html+='<div class="time">'+shift.time+'</div>';
      if(isGroup){
        html+='<div class="pill">Group day</div>';
        html+='<div class="roster"><div class="slot group">&#128101; '+esc(shift.group)+'</div></div>';
      } else {
        html+='<div class="roster">';
        for(var si=0;si<MAX_SLOTS;si++){
          if(si<filled) html+='<div class="slot filled">&#128100; '+esc(shift.volunteers[si])+'</div>';
          else html+='<div class="slot open">&#9675; Open</div>';
        }
        html+='</div>';
        if(isFull) html+='<div class="avail">Full</div>';
      }
      if(shift.supervisor&&shift.supervisor.name&&shift.supervisor.name!=='TBD') html+='<div class="sup">Sup: '+esc(shift.supervisor.name)+'</div>';
      html+='</div>';
    }
    grid.innerHTML=html;
    Array.prototype.forEach.call(grid.querySelectorAll('.cell.shift:not(.full):not(.group)'),function(el){
      el.addEventListener('click',function(){ toggle(el.getAttribute('data-key')); });
    });
  }

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function toggle(k){
    if(selected[k]) delete selected[k]; else selected[k]=shiftsByKey[k];
    render(); updateTray();
  }

  function updateTray(){
    var keys=Object.keys(selected).sort(), n=keys.length;
    document.getElementById('trayCount').textContent=n;
    document.getElementById('trayPlural').textContent=(n===1?'':'s');
    var chips=document.getElementById('chips'); chips.innerHTML='';
    keys.forEach(function(k){
      var s=selected[k], label=s.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      var c=document.createElement('div'); c.className='chip';
      c.innerHTML=esc(label)+' <b data-k="'+k+'">&#215;</b>';
      c.querySelector('b').addEventListener('click',function(){ toggle(k); });
      chips.appendChild(c);
    });
    tray.classList.toggle('open',n>0);
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function submitOne(dateObj,info){
    var fd=new FormData();
    fd.append(E.first,info.first);
    fd.append(E.last,info.last);
    fd.append(E.email,info.email);
    fd.append(E.phone,info.phone);
    fd.append(E.date+'_year',dateObj.getFullYear());
    fd.append(E.date+'_month',dateObj.getMonth()+1);
    fd.append(E.date+'_day',dateObj.getDate());
    fd.append(E.date,dateObj.getFullYear()+'-'+pad(dateObj.getMonth()+1)+'-'+pad(dateObj.getDate()));
    return fetch(FORM_ACTION,{method:'POST',mode:'no-cors',body:fd});
  }

  var submitBtn=document.getElementById('submitBtn');
  submitBtn.addEventListener('click',function(){
    var info={
      first:document.getElementById('fFirst').value.trim(),
      last:document.getElementById('fLast').value.trim(),
      email:document.getElementById('fEmail').value.trim(),
      phone:document.getElementById('fPhone').value.trim()
    };
    var keys=Object.keys(selected);
    if(!keys.length){ return; }
    if(!info.first||!info.last||!info.email||!info.phone){ flashNote('Please fill in all four fields.'); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(info.email)){ flashNote('Please enter a valid email address.'); return; }

    submitBtn.disabled=true; submitBtn.textContent='Signing you up…';
    var chain=Promise.resolve();
    keys.forEach(function(k){ chain=chain.then(function(){ return submitOne(selected[k].date,info); }); });
    chain.then(function(){
      var n=keys.length;
      document.getElementById('successMsg').innerHTML='You signed up for <b>'+n+' shift'+(n===1?'':'s')+'</b>. A confirmation email is on its way to <b>'+esc(info.email)+'</b> for each one, with your supervisor’s details and a cancellation link.';
      overlay.classList.add('open');
    }).catch(function(){
      flashNote('Something went wrong. Please try again or call the pantry.');
    }).then(function(){
      submitBtn.disabled=false; submitBtn.textContent='Sign me up';
    });
  });

  var noteTimer;
  function flashNote(msg){
    var n=document.getElementById('formNote'); n.textContent=msg; n.style.color='#dc2626';
    clearTimeout(noteTimer);
    noteTimer=setTimeout(function(){ n.textContent="You'll get a confirmation email for each shift."; n.style.color=''; },4000);
  }

  document.getElementById('successClose').addEventListener('click',function(){
    overlay.classList.remove('open');
    selected={};
    ['fFirst','fLast','fEmail','fPhone'].forEach(function(id){ document.getElementById(id).value=''; });
    updateTray(); render();
  });

  document.getElementById('prevBtn').addEventListener('click',function(){ if(monthIdx>0){ monthIdx--; render(); } });
  document.getElementById('nextBtn').addEventListener('click',function(){ if(monthIdx<months.length-1){ monthIdx++; render(); } });

  function init(){ buildShifts(); buildMonths(); if(!months.length){ grid.innerHTML='<div class="error" style="grid-column:1/-1;">No shifts available right now.</div>'; return; } render(); updateTray(); }

  function useSample(){
    document.getElementById('banner').style.display='block';
    document.getElementById('banner').textContent='Preview mode: showing example shifts. On your live website, real shifts and signups load automatically.';
    supervisorsData=[['Day','Group','Name','Phone','Email'],
      ['Monday','','Amy Wright','215-555-0101','amy@example.org'],
      ['Tuesday','','Melissa Neville','215-555-0102','melissa@example.org'],
      ['Wednesday','','Amy Stank','215-555-0103','amys@example.org'],
      ['Thursday','','Christie Gera','215-555-0104','christie@example.org'],
      ['Friday','','Rosemarie K.','215-555-0105','rose@example.org']];
    signupsData=[['Timestamp','First','Last','Email','Phone','Date','Reason','Status']];
    var sampleNames=[['Dawn','Miller'],['Robert','Hayes'],['Linda','Carter'],['James','Boyd'],['Susan','Reed']];
    var t=new Date(); t.setHours(0,0,0,0); var cnt=0;
    for(var i=1;i<=16 && cnt<5;i++){
      var dd=new Date(t); dd.setDate(t.getDate()+i);
      if(dd.getDay()===0||dd.getDay()===6) continue;
      var iso=dd.getFullYear()+'-'+pad(dd.getMonth()+1)+'-'+pad(dd.getDate());
      var fillN=(cnt%3)+1;
      for(var j=0;j<fillN;j++){ var nm=sampleNames[(cnt+j)%sampleNames.length]; signupsData.push(['',nm[0],nm[1],'','',iso,'','']); }
      cnt++;
    }
  }

})();
