  /* ---- Impact stats live in the script at the bottom. Edit them monthly. ---- */
  :root{
    --ink:#1A1A1A; --warm-gray:#6B6560; --orange:#E8751A; --green:#1B8A2A;
    --bgA:#FFF5EB; --bgB:#F5F3ED; --bgC:#DCFADE;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;cursor:pointer;
    background:linear-gradient(170deg,var(--bgA) 0%,var(--bgB) 45%,var(--bgC) 100%);
    background-size:200% 200%;animation:bgshift 40s ease-in-out infinite alternate;
  }
  @keyframes bgshift{0%{background-position:0% 0%;}100%{background-position:100% 100%;}}

  /* Whole stage drifts slowly so nothing stays in one spot (burn-in protection) */
  .stage{
    height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    text-align:center;padding:7vh 6vw 6vh;animation:drift 90s ease-in-out infinite alternate;
  }
  @keyframes drift{0%{transform:translate(-8px,-6px);}50%{transform:translate(8px,4px);}100%{transform:translate(-4px,8px);}}

  .clock{font-size:clamp(44px,9vw,84px);font-weight:800;letter-spacing:-2px;line-height:1;color:var(--ink);}
  .date{font-size:clamp(17px,2.6vw,24px);font-weight:600;color:var(--warm-gray);margin-top:8px;}

  .middle{display:flex;flex-direction:column;align-items:center;}
  .logo-wrap{position:relative;animation:float 7s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
  .logo-wrap::before{
    content:'';position:absolute;inset:-14%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 70%);z-index:-1;
  }
  .logo{width:clamp(200px,42vw,340px);height:auto;display:block;}
  .logo-fallback{display:none;font-size:clamp(120px,22vw,190px);line-height:1;}
  .title{font-size:clamp(26px,4.6vw,42px);font-weight:800;letter-spacing:-1px;margin-top:22px;}
  .sub{font-size:clamp(16px,2.4vw,21px);color:var(--warm-gray);font-weight:500;margin-top:4px;}

  .tap{
    margin-top:34px;display:inline-flex;align-items:center;gap:12px;
    background:linear-gradient(140deg,#34B84A 0%,#1B8A2A 55%,#146B20 100%);color:#fff;
    font-size:clamp(20px,3.4vw,30px);font-weight:800;letter-spacing:-.4px;
    padding:20px 38px;border-radius:999px;box-shadow:0 14px 34px rgba(27,138,42,.32);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 14px 34px rgba(27,138,42,.32);}50%{transform:scale(1.045);box-shadow:0 18px 44px rgba(27,138,42,.45);}}
  .tap .hand{display:inline-block;animation:wiggle 2.6s ease-in-out infinite;}
