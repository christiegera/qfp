<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantry Board · Quakertown Food Pantry</title>
  <link rel="icon" type="image/x-icon" href="carrot.png">
<style>
  :root{
    --ink:#1A1A1A; --cream:#F5F3ED; --warm-gray:#6B6560; --light-gray:#B5B0A8;
    --border:#E5E2DB; --orange:#E8751A; --orange-pale:#FFF0E0;
    --green:#1B8A2A; --green-pale:#DCFADE; --blue:#2B7CB5; --blue-pale:#DBEDF9;
    --pink:#C75B6B; --pink-pale:#FCE8EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    background:linear-gradient(170deg,#FFF5EB 0%,var(--cream) 45%,var(--green-pale) 100%);
    color:var(--ink);-webkit-font-smoothing:antialiased;cursor:none;
    display:flex;flex-direction:column;padding:1.6vh 1.4vw;gap:1.6vh;}

  /* Top bar */
  .top{display:flex;align-items:center;gap:1.2vw;flex:0 0 auto;}
  .top img{height:6.5vh;width:auto;}
  .top h1{font-size:3.4vh;font-weight:750;letter-spacing:-.04em;}
  .top .date{font-size:2.3vh;color:var(--warm-gray);font-weight:600;}
  .top .clock{margin-left:auto;font-size:4.6vh;font-weight:750;color:var(--green);font-variant-numeric:tabular-nums;}

  /* Quadrants */
  .quad{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.6vh 1.2vw;}
  .q{background:#fff;border-radius:2vh;border-top:1.1vh solid var(--c);
    box-shadow:0 .4vh 2vh rgba(0,0,0,.06);padding:2vh 1.6vw;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .q.ann{--c:var(--pink);--p:var(--pink-pale);}
  .q.shift{--c:var(--green);--p:var(--green-pale);}
  .q.gah{--c:var(--blue);--p:var(--blue-pale);}
  .q.bag{--c:var(--orange);--p:var(--orange-pale);}
  .qh{display:flex;align-items:baseline;gap:1vw;margin-bottom:1.4vh;flex:0 0 auto;}
  .qh h2{font-size:3.3vh;font-weight:750;letter-spacing:-.03em;}
  .qh .when{margin-left:auto;font-size:2vh;font-weight:700;color:var(--c);background:var(--p);padding:.5vh 1vw;border-radius:100px;white-space:nowrap;}
  .qb{flex:1 1 auto;min-height:0;overflow:hidden;font-size:2.8vh;}   /* font-size is auto-shrunk to fit */

  .meta{font-size:.8em;color:var(--warm-gray);margin-bottom:.6em;}
  .meta b{color:var(--ink);}
  .grp{display:inline-block;background:var(--p);color:var(--c);font-weight:750;border-radius:.6em;padding:.25em .7em;margin-bottom:.6em;}
  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(11em,1fr));gap:.35em 1.2em;}
  .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nm::before{content:"";display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--c);margin-right:.5em;vertical-align:middle;}
  .nm small{font-weight:500;color:var(--warm-gray);font-size:.75em;}
  .empty{color:var(--light-gray);font-size:.9em;}

  /* Announcements */
  .ann ul{list-style:none;display:flex;flex-direction:column;gap:.6em;}
  .anntrack ul{padding-bottom:.6em;}
  .anntrack{animation:annscroll linear infinite;will-change:transform;}
  @keyframes annscroll{from{transform:translateY(0);}to{transform:translateY(calc(-1 * var(--dist)));}}
  .q.ann .annlist.scrolling{-webkit-mask-image:linear-gradient(transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(transparent,#000 7%,#000 93%,transparent);}
  .ann li{background:var(--p);border-radius:.6em;padding:.55em .8em;font-weight:600;line-height:1.3;}
  /* Announcements with a QR code: pinned at the top (a moving code is hard to scan), the rest scroll below */
  #annBody{display:flex;flex-direction:column;gap:.6em;}
  .annlist{flex:1 1 auto;min-height:0;overflow:hidden;}
  .annfeat{flex:0 0 auto;display:flex;align-items:center;gap:.9em;background:var(--p);border-radius:.6em;padding:.6em .8em;font-weight:600;line-height:1.3;}
  .annfeat .annmsg{flex:1 1 auto;min-width:0;}
  .annfeat figure{flex:0 0 auto;margin:0;text-align:center;}
  .annfeat img{display:block;height:20vh;width:20vh;background:#fff;border-radius:.4em;padding:.6vh;}
  .annfeat figcaption{font-size:.62em;margin-top:.3em;color:var(--warm-gray);}

  /* GAH table */
  .stores{display:flex;flex-direction:column;gap:.35em;}
  .store{display:flex;gap:.8em;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:.35em;}
  .store:last-child{border-bottom:0;}
  .store .s{flex:0 0 9em;color:var(--warm-gray);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .store .d{font-weight:700;}

  /* Bag packers */
  .pk{display:flex;flex-direction:column;gap:.5em;}
  .pk .row{display:flex;gap:.8em;align-items:baseline;}
  .pk .lbl{flex:0 0 8em;color:var(--warm-gray);font-weight:600;font-size:.85em;}
  .pk .who{font-weight:700;}

  /* Full schedule button + pop-up */
  .q.shift{cursor:pointer;}
  .full{margin-left:.8vw;font:inherit;font-size:1.9vh;font-weight:700;white-space:nowrap;
    border:2px solid var(--c);color:var(--c);background:#fff;border-radius:100px;padding:.45vh 1vw;cursor:pointer;}
  .c-shift{--c:var(--green);--p:var(--green-pale);}
  .c-gah{--c:var(--blue);--p:var(--blue-pale);}
  .c-bag{--c:var(--orange);--p:var(--orange-pale);}
  .c-drives{--c:#0E8A86;--p:#E1F3F2;}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:3vh 3vw;}
  .sheet.show{display:flex;}
  .panel{background:#fff;border-radius:2vh;width:100%;max-width:1500px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;border-top:1.1vh solid var(--c);}
  .ph{display:flex;align-items:center;gap:1vw;padding:2vh 2vw;border-bottom:1px solid var(--border);}
  .ph h2{font-size:3.4vh;font-weight:750;letter-spacing:-.03em;}
  .close{margin-left:auto;font:inherit;font-size:2.4vh;font-weight:750;background:var(--ink);color:#fff;border:0;border-radius:100px;padding:1vh 2.2vw;cursor:pointer;}
  .pb{overflow-y:auto;padding:1.5vh 2vw 3vh;font-size:2.4vh;-webkit-overflow-scrolling:touch;}
  .pnote{font-size:.8em;color:var(--warm-gray);margin-bottom:.8em;}
  table.sch{width:100%;border-collapse:collapse;}
  .sch th{text-align:left;font-size:.8em;color:var(--warm-gray);padding:.5em .6em;border-bottom:2px solid var(--border);position:sticky;top:0;background:#fff;}
  .sch td{padding:.55em .6em;border-bottom:1px solid var(--border);vertical-align:top;}
  .sch tr.past td{color:var(--warm-gray);}
  .sch tr.today td{background:var(--p);font-weight:700;}
  .sch .tc{background:var(--p);font-weight:700;}
  .sch .open{color:var(--light-gray);}
  .sch small{color:var(--warm-gray);font-weight:600;}
  .tag{display:inline-block;font-size:.7em;font-weight:750;padding:.15em .6em;border-radius:100px;background:var(--c);color:#fff;margin-left:.5em;vertical-align:middle;}
  /* Calendar view in the pop-up */
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.4em;font-size:.78em;}
  .cal .dh{text-align:center;font-weight:750;color:var(--warm-gray);font-size:.85em;text-transform:uppercase;letter-spacing:.04em;padding-bottom:.2em;position:sticky;top:-1.5vh;background:#fff;z-index:1;}
  .cd{border:1px solid var(--border);border-radius:.6em;padding:.4em .5em;min-height:5.2em;line-height:1.25;overflow:hidden;}
  .cd .dn{font-weight:750;font-size:.95em;margin-bottom:.2em;white-space:nowrap;}
  .cd .dn .tag{font-size:.65em;margin-left:.3em;}
  .cd .tm{font-size:.75em;font-weight:700;color:var(--c);margin-bottom:.15em;}
  .cd .ln{font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd .ln small{color:var(--warm-gray);font-weight:600;}
  .cd .grpd{font-weight:750;color:var(--c);}
  .cd .open{color:var(--light-gray);}
  .cd.none{background:#FAF9F6;border-color:#F0EEE8;}
  .cd.none .dn{color:var(--light-gray);}
  .cd.past{opacity:.55;}
  .cd.today{border:2px solid var(--c);background:var(--p);opacity:1;}

  /* Night mode + pixel shift */
  .top,.quad,.foot{transition:transform 2s ease;}
  .night{position:fixed;inset:0;z-index:100;display:none;overflow:hidden;cursor:pointer;
    background:radial-gradient(120% 90% at 30% 20%,#1E3A22 0%,#0F2013 55%,#081209 100%);}
  .night.show{display:block;}
  /* The card drifts slowly around the screen so nothing stays in one spot overnight */
  .saver{position:absolute;left:0;top:0;width:34vw;min-width:420px;text-align:center;will-change:transform;
    background:rgba(251,246,236,.9);border-radius:3vh;padding:3.4vh 2.6vw 3vh;box-shadow:0 2vh 6vh rgba(0,0,0,.35);}
  .slogo img{max-width:72%;max-height:18vh;display:block;margin:0 auto 1.6vh;}
  .slogo{font-family:Georgia,serif;font-style:italic;font-size:3.2vh;font-weight:700;color:#2C5126;}
  .smsg{font-family:Georgia,serif;font-style:italic;font-size:3.4vh;font-weight:700;color:#2C5126;line-height:1.25;min-height:4.3vh;transition:opacity .8s;}
  .smsg.fade{opacity:0;}
  .snext{margin-top:1.6vh;display:inline-block;background:#E8751A;color:#fff;font-weight:800;font-size:2vh;border-radius:99px;padding:.7vh 1.4vw;}
  .sclock{margin-top:1.4vh;font-size:2.2vh;font-weight:700;color:#6B6560;font-variant-numeric:tabular-nums;}
  .stap{position:absolute;bottom:2.4vh;left:0;right:0;text-align:center;font-size:1.5vh;color:rgba(255,255,255,.28);font-weight:600;}

  .foot{flex:0 0 auto;text-align:center;font-size:2.1vh;color:var(--warm-gray);font-weight:600;}

  /* Layout: menu tall on the left; right side = announcements, pantry shift (biggest), and a short GAH + bag packers strip */
  .quad{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:minmax(0,1.4fr) minmax(0,.75fr) minmax(0,.65fr);}   /* announcements taller for QR codes */
  /* Left column: menu on top, food drives (2 rows of cards) underneath. Change the 1.5 / 1 to give one more room. */
  .leftcol{grid-column:1;grid-row:1 / span 3;display:flex;flex-direction:column;gap:1.6vh;min-height:0;}
  .leftcol .q.menu{flex:1.5 1 0;}
  .leftcol .q.drives{flex:1 1 0;}
  /* Upcoming food drives: a short strip under the menu, one card per drop-off */
  .q.drives{--c:#0E8A86;--p:#E1F3F2;padding:1.4vh 1.2vw;}
  .q.drives .qh{margin-bottom:1.2vh;}
  .q.drives .qh h2{font-size:2.2vh;color:var(--c);}
  .q.drives{cursor:pointer;}
  .q.drives .full{margin-left:auto;font-size:1.6vh;padding:.3vh .8vw;}
  .drv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:.8em 1em;height:100%;align-items:stretch;}   /* 3 across x 2 rows, every box the same size; text sits at the top */
  .dc{flex:1 1 0;min-width:0;background:var(--p);border-radius:.6em;padding:.7em .9em;display:flex;flex-direction:column;justify-content:flex-start;gap:.3em;line-height:1.25;}
  .dc .dd{font-size:.72em;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  .dc .dg{font-weight:750;overflow-wrap:break-word;}   /* full name, wraps to a second line if needed */
  .dc .dt{font-size:.75em;font-weight:650;color:var(--warm-gray);white-space:nowrap;}
  .dc.today{background:var(--c);}
  .dc.today .dd,.dc.today .dg,.dc.today .dt{color:#fff;}
  .dc.on{background:#fff;border:2px dashed var(--c);flex-grow:1.3;}
  .dc.on .dg{font-weight:650;font-size:.85em;}
  .q.ann{grid-column:2;grid-row:1;}
  .q.shift{grid-column:2;grid-row:2;}
  .q.shift{padding-top:1.4vh;padding-bottom:1.4vh;}
  .q.shift .qh{flex-wrap:nowrap;margin-bottom:.8vh;}
  .q.shift .qh h2{font-size:2.6vh;white-space:nowrap;}
  .q.shift .qh .when{font-size:1.7vh;padding:.4vh .8vw;}
  .q.shift .qh .full{white-space:nowrap;}
  .q.crew{grid-column:2;grid-row:3;--c:#9AA3AD;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.4vw;padding:1.4vh 1.2vw;}
  .half{min-width:0;min-height:0;display:flex;flex-direction:column;cursor:pointer;}
  .half + .half{border-left:2px solid var(--border);padding-left:1.4vw;}
  .half.gah{--c:var(--blue);--p:var(--blue-pale);}
  .half.bag{--c:var(--orange);--p:var(--orange-pale);}
  .half .qh{margin-bottom:.3vh;flex-wrap:nowrap;}
  .half .qh h2{font-size:2vh;color:var(--c);}
  .half .full{padding:.25vh .6vw;font-size:1.4vh;margin-left:auto;}
  .half .sub{font-size:1.5vh;font-weight:700;color:var(--warm-gray);margin-bottom:.6vh;}
  .half .store{border-bottom:0;padding-bottom:0;}
  .half .stores{gap:.15em;}
  .half .store .s{flex-basis:6.5em;}
  .half .pk{gap:.2em;}
  .half .pk .lbl{flex-basis:5.5em;}

  /* Menu */
  .q.menu{--c:#7A3E9D;--p:#F3E8F8;}
  .c-menu{--c:#7A3E9D;--p:#F3E8F8;}
  /* "Week of" pill with the See next week button tucked right under it */
  .q.menu .qh{align-items:flex-start;}
  .mwhen{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:.6vh;}
  .mwhen .when{margin-left:0;}
  .mwhen .full{margin-left:0;font-size:1.5vh;padding:.3vh .8vw;}
  #sheetBody .mrows{font-size:2.6vh;}
  .mrows{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7em 1.6em;align-items:start;}   /* menu in 2 columns, read left to right */
  .mrow{border-left:.35em solid var(--mc);padding:.1em 0 .1em .65em;}
  .mrow .cat{display:block;font-weight:800;color:var(--mc);text-transform:uppercase;letter-spacing:.04em;font-size:.72em;}
  .mrow .its{font-weight:650;line-height:1.3;}
  .mrow .nt{display:inline-block;margin-left:.5em;font-size:.7em;font-weight:800;color:#fff;background:var(--mc);border-radius:99px;padding:.1em .6em;vertical-align:middle;}
  .mkey{margin-top:.8em;font-size:.66em;color:var(--warm-gray);}
  .foot b{color:var(--green);}
  .annnone{color:var(--warm-gray);font-style:italic;}
  .banner{position:fixed;bottom:.6vh;right:1vw;font-size:1.4vh;color:#8a4a12;background:var(--orange-pale);padding:.3vh .7vw;border-radius:100px;display:none;}
</style>
</head>
<body>
  <div class="top">
    <img src="qfp_trans.png" alt="" onerror="this.style.display='none'">
    <div>
      <h1>Quakertown Food Pantry</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="quad">
    <div class="leftcol">
    <section class="q menu">
      <div class="qh"><h2>&#127869;&#65039; This Week's Menu</h2><div class="mwhen"><span class="when" id="menuWhen"></span><button class="full" id="menuNext">See next week &rsaquo;</button></div></div>
      <div class="qb" id="menuBody"></div>
    </section>
    <section class="q drives" data-full="drives">
      <div class="qh"><h2>&#129387; Food Drives Coming In</h2><button class="full">All &rsaquo;</button></div>
      <div class="qb" id="drivesBody"></div>
    </section>
    </div>
    <section class="q ann">
      <div class="qh"><h2>&#128227; Announcements</h2></div>
      <div class="qb" id="annBody"></div>
    </section>
    <section class="q shift" data-full="shift">
      <div class="qh"><h2>&#129365; Pantry Shift</h2><span class="when" id="shiftWhen"></span><button class="full">Full schedule &rsaquo;</button></div>
      <div class="qb" id="shiftBody"></div>
    </section>
    <section class="q crew">
      <div class="half gah" data-full="gah">
        <div class="qh"><h2>&#128666; GAH Drivers</h2><button class="full">All &rsaquo;</button></div>
        <div class="sub" id="gahWhen"></div>
        <div class="qb" id="gahBody"></div>
      </div>
      <div class="half bag" data-full="bag">
        <div class="qh"><h2>&#128717;&#65039; Bag Packers</h2><button class="full">All &rsaquo;</button></div>
        <div class="sub" id="bagWhen"></div>
        <div class="qb" id="bagBody"></div>
      </div>
    </section>
  </div>

  <div class="foot">Volunteers: <b>sign in, sign out, and sign up for shifts on the iPad kiosk.</b></div>
  <div class="banner" id="banner">Preview: example data</div>

  <div class="sheet" id="sheet">
    <div class="panel" id="panel">
      <div class="ph"><h2 id="sheetTitle"></h2><button class="close" id="sheetClose">&#10005; Close</button></div>
      <div class="pb" id="sheetBody"></div>
    </div>
  </div>

  <div class="night" id="night">
    <div class="saver" id="saver">
      <div class="slogo"><img src="qfp_trans.png" alt="Quakertown Food Pantry" onerror="this.parentNode.textContent='Quakertown Food Pantry'"></div>
      <div class="smsg" id="smsg"></div>
      <div class="snext" id="snext"></div>
      <div class="sclock" id="sclock"></div>
    </div>
    <div class="stap">Tap anywhere to wake the board</div>
  </div>

<script>
(function(){
  'use strict';
  // Always use East Coast time, no matter what time zone the computer is set to
  var TIME_ZONE='America/New_York';
  function nowNY(){ var d=new Date(); try{ return new Date(d.toLocaleString('en-US',{timeZone:TIME_ZONE})); }catch(e){ return d; } }

  /* ===== CONFIG ===== */
  var SPREADSHEET_ID = '1q1S4UHYOxME7j8E0EQmKNHh_P3ldmvk3YfeAqlLmGug';
  var SUPERVISORS_GID = '502386465';
  var SIGNUPS_GID = '1435555973';
  var BAGPACKERS_GID = '1531693386';
  var GAH_GID = '1136888994';
  // Announcements live in their own sheet so others can post without touching the main sheet.
  // Columns: Message | Show from (optional date) | Show until (optional date). Blank dates = always on.
  var ANNOUNCEMENTS_SHEET_ID = '1y_BFxh5Om4NNDE9GC_Cbeq2ahZHQajprFm24qXoV6Z0';
  var ANNOUNCEMENTS_GID = '0';
  // The board shows only what is in the announcements sheet. Nothing built in.
  var DEFAULT_ANNOUNCEMENTS = [];
  var ANN_ROTATE_SEC = 10;   // how long each announcement shows along the bottom

  // Weekly menu: its own Google Sheet, so the management team can edit it without touching
  // the volunteer sheet. Columns: Category | Items | Notes (optional). Share it as
  // "Anyone with the link can view", then paste its ID and the tab's gid here.
  var MENU_SHEET_ID = '1T0adYkdD0HMZdbnfw8KX8JsAGS1cdcJq68BNXElczC0';
  var MENU_GID      = '0';
  var MENU_KEY      = '';    // optional line under the menu, e.g. 'D = donated · 1A = one per adult'
  // Week Of stays the Sunday date in the sheet, but the board flips to that week early:
  // 1 day early at 2 AM = Saturday 2:00 AM Eastern, so the new week is up before anyone arrives.
  var MENU_SWITCH_DAYS_EARLY = 1;
  var MENU_SWITCH_HOUR       = 2;   // 2 AM Saturday (overnight Friday)
  var MENU_COLORS   = ['#1F5FAE','#C0392B','#0E8A86','#B0247A','#6A3FA0','#D9661A','#3D3D3D','#2E7D32'];
  // Upcoming food drives: a tab named "Drives" in the announcements sheet. Columns: Date | Group | Time | Notes (optional).
  // Past dates drop off by themselves. Leave Date blank for ongoing ones (boxes at businesses, Quilters...).
  // Found by tab name, so nothing to paste here. Renaming the tab means changing this too.
  var DRIVES_TAB = 'Drives';
  var REFRESH_MIN = 5;  // reload data from the sheet every few minutes
  var MINI_TEXT = 0.017; // text size in the compact GAH / Bag Packers strip (share of screen height; main sections use 0.028)
  var PAGE_RELOAD_MIN = 60;   // fully reload the page this often, so updates to board.html show up on their own

  // Night mode / screensaver. Off = the board stays on all the time.
  var NIGHT_MODE     = false;
  // When night mode is on, the screen shows a screensaver between these hours (24-hour clock).
  var NIGHT_OFF_HOUR = 21;   // 9 PM
  var NIGHT_ON_HOUR  = 7;    // 7 AM
  var WAKE_MIN       = 2;    // how long a tap keeps it awake at night
  // Screensaver shown during those hours: a slowly drifting card with these rotating messages.
  var SAVER_MESSAGES = [
    'Thank you for all you do!',
    'See you next shift!',
    'Neighbors helping neighbors.',
    'Every bag packed makes a difference.'
  ];
  var SAVER_MSG_SEC  = 15;   // seconds per message
  var SAVER_SPEED    = 14;   // drift speed, pixels per second
  // Pixel shift: nudge the layout a few pixels now and then so nothing sits in one spot all day.
  var SHIFT_EVERY_MIN = 10;
  var SHIFT_PX        = 4;
  // Announcements with no "Show until" date drop off this many days after they're posted.
  var ANN_DEFAULT_DAYS = 14;
  var ANN_SCROLL_SPEED = 22;   // announcements scroll speed (pixels per second) when they don't all fit

  var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var sup=[], sign=[], bag=[], gah=[], ann=[], menu=[], drives=[], preview=false;

  function csvUrl(gid){ return 'https://docs.google.com/spreadsheets/d/'+SPREADSHEET_ID+'/export?format=csv&gid='+gid+'&t='+Date.now(); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function weekNum(d){ return (['1st','2nd','3rd','4th','5th'])[Math.ceil(d.getDate()/7)-1]||'5th'; }
  function shiftTime(day){ return (day==='Tuesday'||day==='Thursday')?'6:00 – 8:00 PM':'10:00 AM – 1:00 PM'; }
  function toLocalDate(v){ var s=String(v||'').trim(); var m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(m) return new Date(+m[1],+m[2]-1,+m[3]); return new Date(s); }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); x.setHours(0,0,0,0); return x; }
  function whenLabel(d){ var t=addDays(nowNY(),0); var diff=Math.round((d-t)/864e5);
    return diff===0?'Today':(diff===1?'Tomorrow':DAYS[d.getDay()]+', '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})); }

  function parseCSV(text){
    var rows=[], row=[], cur='', q=false;
    for(var i=0;i<text.length;i++){ var c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c==='"') q=true;
        else if(c===','){ row.push(cur); cur=''; }
        else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=''; }
        else cur+=c; } }
    if(cur!==''||row.length){ row.push(cur); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(c){ return (c||'').trim(); }); });
  }

  /* ===== data lookups ===== */
  function findSup(d){
    var day=DAYS[d.getDay()], wk=weekNum(d), hit=null;
    for(var i=1;i<sup.length;i++){ var r=sup[i];
      if(r[0]===wk+' '+day) return r;          // a "2nd Monday"-style row wins
      if(r[0]===day && !hit) hit=r; }
    return hit;
  }
  function signupsOn(d){
    var k=keyOf(d), out=[];
    for(var i=1;i<sign.length;i++){ var r=sign[i]; if(!r[5]) continue;
      if((r[7]||'').trim()==='Cancelled') continue;
      var sd=toLocalDate(r[5]); if(isNaN(sd)||keyOf(sd)!==k) continue;
      out.push(((r[1]||'').trim()+' '+((r[2]||'').trim().charAt(0)||'')+((r[2]||'').trim()?'.':'')).trim()); }
    return out;
  }
  function gahOn(d){
    var col=d.getDay(); if(col<1||col>5) return [];
    var out=[], started=false;
    for(var i=0;i<gah.length;i++){ var r=gah[i];
      if(!started){ if((r[0]||'').trim().toLowerCase()==='store') started=true; continue; }
      var store=(r[0]||'').trim(); if(!store) break;
      out.push({ store:store, driver:(r[col]||'').trim() }); }
    return out;
  }
  function packersOn(d){
    var wd=d.getDay(), word=wd===0?'sunday':(wd===1?'monday':(wd===4?'thursday':''));
    if(!word) return null;
    var wk=weekNum(d).toLowerCase();
    var hit=null, packers=[], backups=[];
    for(var i=1;i<bag.length;i++){ var r=bag[i];     // a slot can have more than one line (Kate + Dean)
      if((r[0]||'').trim().toLowerCase().indexOf(word)!==0) continue;
      if((r[1]||'').trim().toLowerCase()!==wk) continue;
      if(!hit) hit={ label:(r[0]||'').trim() };
      if((r[2]||'').trim()) packers.push((r[2]||'').trim());
      if((r[5]||'').trim()) backups.push((r[5]||'').trim()); }
    if(hit){ hit.packer=packers.join(' & '); hit.backup=backups.join(' & '); return hit; }
    return { label:DAYS[wd], packer:'', backup:'' };
  }
  // First day from today (up to 7 days out) that passes the test.
  function nextDay(test){ for(var n=0;n<8;n++){ var d=addDays(nowNY(),n); if(test(d)) return d; } return addDays(nowNY(),0); }

  /* ===== render ===== */
  // Announcements come from a tab (typically the responses tab of a "Post an announcement" form).
  // Columns are found by header, so it works with or without a Timestamp column:
  //   Announcement | Show from (optional) | Show until (optional) | Approved (optional)
  // If there's an "Approved" column, only rows marked yes / x / ✓ are shown.
  // Optional "QR" column: an image file name uploaded next to board.html (roast-toast-qr.png) or a full image address.
  // Rows with a QR code are pinned at the top with the code beside the message.
  function renderAnn(){
    var t=addDays(nowNY(),0), list=[], feat=[];
    if(ann.length){
      var h=ann[0].map(function(x){ return String(x||'').trim().toLowerCase(); });
      function col(re,skip){ for(var i=0;i<h.length;i++){ if(i!==skip && re.test(h[i])) return i; } return -1; }
      var cTs=col(/timestamp/), cMsg=col(/announce|message/);
      if(cMsg<0) cMsg=(cTs===0?1:0);
      var cFrom=col(/from|start/,cMsg), cTo=col(/until|end|expir/,cMsg), cOk=col(/approv/,cMsg), cQr=col(/qr|image|picture/,cMsg);
      for(var i=1;i<ann.length;i++){ var r=ann[i], msg=String(r[cMsg]||'').trim(); if(!msg) continue;
        if(cOk>-1 && !/^(y|yes|true|x|✓|✔)/i.test(String(r[cOk]||'').trim())) continue;
        var from=cFrom>-1&&r[cFrom]?toLocalDate(r[cFrom]):null, until=cTo>-1&&r[cTo]?toLocalDate(r[cTo]):null;
        if((!until||isNaN(until)) && cTs>-1 && r[cTs]){ var ts=new Date(r[cTs]); if(!isNaN(ts)) until=addDays(ts,ANN_DEFAULT_DAYS); }
        if(from&&!isNaN(from)&&t<from) continue;
        if(until&&!isNaN(until)&&t>until) continue;
        var qr=cQr>-1?String(r[cQr]||'').trim():'';
        if(qr) feat.push({msg:msg, qr:qr}); else list.push(msg); }
    }
    var html = feat.map(function(f){
        return '<div class="annfeat"><div class="annmsg">'+esc(f.msg)+'</div>'+
          '<figure><img src="'+esc(f.qr).replace(/"/g,'&quot;')+'" alt="QR code" onload="this.parentNode.style.display=\'\';window.qfpAnnFit&&qfpAnnFit()" onerror="window.qfpQrRetry&&qfpQrRetry(this)">'+
          '<figcaption>&#128247; Scan with your phone</figcaption></figure></div>';
      }).join('') +
      (list.length ? '<div class="annlist"><ul>'+list.map(function(m){ return '<li>'+esc(m)+'</li>'; }).join('')+'</ul></div>'
                   : (feat.length ? '' : '<p class="annnone">No announcements right now.</p>'));
    var b=document.getElementById('annBody');
    if(b.getAttribute('data-src')===html) return;   // unchanged: don't restart the scroll
    b.setAttribute('data-src',html); b.innerHTML=html;
    setupAnnScroll();
  }
  // If the announcements don't all fit, scroll them slowly upward in a continuous loop.
  // A pinned QR announcement that's too long shrinks its text to fit instead.
  window.qfpAnnFit=function(){ setupAnnScroll(); };   // called when a QR image finishes loading
  // A QR image that isn't on the website yet (just uploaded) hides for now and tries again every minute.
  window.qfpQrRetry=function(img){
    img.parentNode.style.display='none'; setupAnnScroll();
    var base=img.getAttribute('data-base')||img.getAttribute('src');
    img.setAttribute('data-base',base);
    setTimeout(function(){ if(img.isConnected) img.src=base+(base.indexOf('?')>-1?'&':'?')+'r='+Date.now(); }, 60000);
  };
  function setupAnnScroll(){
    var b=document.getElementById('annBody'), box=b.querySelector('.annlist'), ul=box&&box.querySelector('ul');
    var fs=window.innerHeight*0.028; b.style.fontSize=fs+'px';
    var feats=b.querySelectorAll('.annfeat');
    for(var k=0;k<feats.length;k++) feats[k].style.fontSize='';
    var room=function(){ var used=0; for(var j=0;j<feats.length;j++) used+=feats[j].offsetHeight; return b.clientHeight-used-(ul?fs*2.2:0); };
    for(var s=1; feats.length && room()<0 && s>0.6; s-=0.05)
      for(var k2=0;k2<feats.length;k2++) feats[k2].style.fontSize=s+'em';
    if(!ul) return;
    var old=box.querySelector('.anntrack'); if(old){ box.innerHTML=''; box.appendChild(ul); }
    box.classList.remove('scrolling');
    if(ul.offsetHeight<=box.clientHeight) return;
    var track=document.createElement('div'); track.className='anntrack';
    track.appendChild(ul); track.appendChild(ul.cloneNode(true));
    box.innerHTML=''; box.appendChild(track); box.classList.add('scrolling');
    var dist=ul.offsetHeight;
    track.style.setProperty('--dist',dist+'px');
    track.style.animationDuration=Math.max(10,dist/ANN_SCROLL_SPEED)+'s';
  }
  // Everywhere on the board, names show as "First L." for privacy.
  // "Kate Capanear & Dean Capanear" -> "Kate C. & Dean C."; "Robert (Bob) Christian" -> "Bob C.";
  // "Alicia Garner (& son Carson)" -> "Alicia G. & Carson"; "Ed Angelo (line break) Suzi Janssens" -> "Ed A. & Suzi J.";
  // "St. Paul's Church — Thelma Webb / Maggie Shaw" -> "St. Paul's Church — Thelma W. / Maggie S."; one word stays as is.
  function short1(n, nick){
    n=String(n||'').replace(/\s+/g,' ').trim(); if(!n) return '';
    var w=n.split(' '); if(w.length<2) return nick||n;
    var last=w.pop(), first=nick||w.join(' ');
    return first+' '+last.charAt(0).toUpperCase()+'.';
  }
  function shortName(s){
    s=String(s||'').replace(/ /g,' ').trim(); if(!s) return '';
    // Parentheses: one word = nickname "(Bob)"; "(& son Carson)" = extra people; anything else ("as avail") is dropped
    var nick='', extra=[];
    s=s.replace(/\(([^)]*)\)/g, function(_, inner){
      inner=inner.trim();
      if(/^(&|\+|and\b|with\b)/i.test(inner)) extra.push(inner.replace(/^(&|\+|and|with)\s*/i,'').replace(/^(son|daughter|kids?|children|husband|wife|family)\s+/i,''));
      else if(/^[A-Za-z]+$/.test(inner)) nick=inner;
      return '';
    }).trim();
    var lead='', m=s.match(/^(.*?\s(?:—|–|-)\s)(.+)$/);       // keep a group name in front
    if(m){ lead=m[1]; s=m[2]; }
    // Split on &, /, +, "and", line breaks, or a wide gap of spaces ("Todd Benner      Bob Christian")
    var parts=s.split(/(\s*(?:&|\/|\+|\band\b|\n|\s{3,})\s*)/i);
    var out=parts.map(function(part, i){
      if(i%2) return /\//.test(part) ? ' / ' : ' & ';
      return short1(part, parts.length===1 ? nick : '');
    }).join('');
    if(nick && parts.length>1) out=out.replace(/^\S+/, nick);
    extra.filter(String).forEach(function(x){ out+=' & '+(x.split(' ').length>1 ? short1(x) : x); });
    return lead+out;
  }
  function renderShift(){
    var d=nextDay(function(x){ var w=x.getDay(); return w>=1&&w<=5; });
    var day=DAYS[d.getDay()], r=findSup(d), names=signupsOn(d);
    var supName=r?(r[2]||'').trim():'', group=r?(r[1]||'').trim():'';
    document.getElementById('shiftWhen').textContent=whenLabel(d)+' · '+shiftTime(day);
    var h='<div class="meta">Supervisor: <b>'+esc(supName&&supName!=='TBD'?shortName(supName):'TBD')+'</b></div>';
    if(group&&group!=='NA') h+='<div class="grp">&#128101; '+esc(group)+' group day</div>';
    h+= names.length ? '<div class="names">'+names.map(function(n){ return '<div class="nm">'+esc(shortName(n))+'</div>'; }).join('')+'</div>'
                     : '<div class="empty">No online sign-ups yet.</div>';
    document.getElementById('shiftBody').innerHTML=h;
  }
  function renderGah(){
    var d=nextDay(function(x){ var w=x.getDay(); return w>=1&&w<=5; });
    var rows=gahOn(d).filter(function(r){ return r.driver; });   // compact: only stores with a driver
    document.getElementById('gahWhen').textContent=whenLabel(d)+' pickups';
    document.getElementById('gahBody').innerHTML = rows.length
      ? '<div class="stores">'+rows.map(function(r){ return '<div class="store"><span class="s">'+esc(r.store)+'</span><span class="d">'+esc(shortName(r.driver))+'</span></div>'; }).join('')+'</div>'
      : '<div class="empty">No pickups scheduled.</div>';
  }
  function renderBag(){
    var d=nextDay(function(x){ var w=x.getDay(); return w===0||w===1||w===4; });
    var p=packersOn(d)||{label:'',packer:'',backup:''};
    document.getElementById('bagWhen').textContent=whenLabel(d)+(p.label&&p.label.indexOf(' ')>-1?' '+p.label.split(' ').slice(1).join(' ').toLowerCase():'');
    var h='<div class="pk">';
    h+='<div class="row"><span class="lbl">Packer</span><span class="who">'+(p.packer?esc(shortName(p.packer)):'<span class="empty">Open</span>')+'</span></div>';
    if(p.backup) h+='<div class="row"><span class="lbl">Backup</span><span class="who">'+esc(shortName(p.backup))+'</span></div>';
    // Then the next packing day
    var seen=keyOf(d);
    for(var n=0;n<8;n++){ var x=addDays(nowNY(),n); if(keyOf(x)===seen) continue;
      var w=x.getDay(); if(!(w===0||w===1||w===4)||x<d) continue;
      var q=packersOn(x);
      if(q){ h+='<div class="row" style="margin-top:.4em"><span class="lbl">Next · '+esc(DAYS[x.getDay()].slice(0,3))+'</span><span class="who">'+(q.packer?esc(shortName(q.packer)):'<span class="empty">Open</span>')+'</span></div>'; break; } }
    document.getElementById('bagBody').innerHTML=h+'</div>';
  }

  /* ===== weekly menu ===== */
  // Reads Week Of | Category | Items | Notes by header name; blank rows are skipped.
  // Week Of is the Sunday the menu starts. Only the first row of each week needs the date;
  // the rows under it belong to the same week. The board shows the latest week that has
  // started, so it switches over by itself every Sunday. No Week Of column = show every row.
  // Reads the menu sheet into { start, rows (this week), next, nextRows (the week after) }.
  function menuWeeks(){
    var all=[], h=(menu[0]||[]).map(function(x){ return String(x||'').trim().toLowerCase(); });
    function col(re,def){ for(var i=0;i<h.length;i++){ if(re.test(h[i])) return i; } return def; }
    var cW=col(/week|start|date/,-1);
    var cC=col(/categ|section|type/,cW===0?1:0), cI=col(/item|food|what/,cW===0?2:1), cN=col(/note|limit|extra/,-1);
    var wk=null;
    for(var i=1;i<menu.length;i++){ var r=menu[i], cat=String(r[cC]||'').trim(), its=String(r[cI]||'').trim();
      if(cW>-1 && String(r[cW]||'').trim()){ var wd=toLocalDate(r[cW]); if(!isNaN(wd)){ wd.setHours(0,0,0,0); wk=wd; } }
      if(!cat&&!its) continue;
      all.push({ wk:wk, cat:cat, its:its, nt:cN>-1?String(r[cN]||'').trim():'' }); }
    var t=addDays(nowNY(),0), now=nowNY(), start=null, rows=all, next=null, nextRows=[];
    function switchAt(wk){ var s=addDays(wk,-MENU_SWITCH_DAYS_EARLY); s.setHours(MENU_SWITCH_HOUR,0,0,0); return s; }
    if(cW>-1){
      all.forEach(function(r){ if(r.wk && switchAt(r.wk)<=now && (!start||r.wk>start)) start=r.wk; });
      if(!start) all.forEach(function(r){ if(r.wk && (!start||r.wk<start)) start=r.wk; });   // nothing started yet: show the first week
      rows=all.filter(function(r){ return start && r.wk && keyOf(r.wk)===keyOf(start); });
      // Next week = the soonest week after this one that has a menu (normally the following Sunday).
      if(start) all.forEach(function(r){ if(r.wk && r.wk>start && (!next||r.wk<next)) next=r.wk; });
      if(next) nextRows=all.filter(function(r){ return r.wk && keyOf(r.wk)===keyOf(next); });
    }
    // A category with no items yet (a blank template week, or an empty Extras) isn't shown.
    function filled(list){ return list.filter(function(r){ return r.its; }); }
    rows=filled(rows); nextRows=filled(nextRows);
    if(!start) start=addDays(t,-t.getDay());
    return { start:start, rows:rows, next:next||addDays(start,7), nextRows:nextRows };
  }
  function menuHtml(rows){
    var html='<div class="mrows">'+rows.map(function(r,i){
      return '<div class="mrow" style="--mc:'+MENU_COLORS[i%MENU_COLORS.length]+'"><span class="cat">'+esc(r.cat)+'</span>'+
        '<span class="its">'+esc(r.its)+(r.nt?'<span class="nt">'+esc(r.nt)+'</span>':'')+'</span></div>';
    }).join('')+'</div>';
    if(MENU_KEY) html+='<div class="mkey">'+esc(MENU_KEY)+'</div>';
    return html;
  }
  function weekOf(d){ return 'Week of '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
  function renderMenu(){
    var m=menuWeeks();
    document.getElementById('menuWhen').textContent=weekOf(m.start);
    if(!m.rows.length){ document.getElementById('menuBody').innerHTML='<div class="empty">This week\'s menu hasn\'t been posted yet.</div>'; return; }
    document.getElementById('menuBody').innerHTML=menuHtml(m.rows);
  }
  // "See next week" pop-up
  function fullMenuNext(){
    var m=menuWeeks();
    document.getElementById('sheetTitle').textContent='🍽️ Next Week\'s Menu · '+weekOf(m.next);
    return m.nextRows.length ? menuHtml(m.nextRows)
      : '<p class="empty" style="font-size:2.6vh;padding:3vh 0;text-align:center">No menu has been set for next week yet.<br>Check back soon!</p>';
  }

  /* ===== upcoming food drives ===== */
  // "1:00 PM" stays as is; a 24-hour "13:00:00" from the sheet becomes "1:00 PM".
  function fmtTime(v){ var s=String(v||'').trim(), m=s.match(/^(\d{1,2}):(\d{2})(:\d{2})?$/);
    if(!m) return s; var hr=+m[1]; return ((hr%12)||12)+':'+m[2]+(hr<12?' AM':' PM'); }
  // Every row of the Drives tab: dated drives (soonest first, past ones included) and the undated "ongoing" ones.
  function driveData(){
    var h=(drives[0]||[]).map(function(x){ return String(x||'').trim().toLowerCase(); });
    function col(re,def){ for(var i=0;i<h.length;i++){ if(re.test(h[i])) return i; } return def; }
    var cD=col(/date|day|when/,0), cG=col(/group|who|name|drive|org/,1), cT=col(/time/,2), cN=col(/note/,-1);
    var t=addDays(nowNY(),0), all=[], ongoing=[];
    for(var i=1;i<drives.length;i++){ var r=drives[i], g=String(r[cG]||'').trim(), ds=String(r[cD]||'').trim();
      if(!g) continue;
      var d=ds?toLocalDate(ds):null;
      if(!d||isNaN(d)){ ongoing.push(g); continue; }
      if(d.getFullYear()<t.getFullYear()-1){ d.setFullYear(t.getFullYear()); if(d<addDays(t,-60)) d.setFullYear(t.getFullYear()+1); }   // "11/14" with no year
      d.setHours(0,0,0,0);
      all.push({ d:d, g:g, tm:fmtTime(r[cT]), nt:cN>-1?String(r[cN]||'').trim():'' }); }
    all.sort(function(a,b){ return a.d-b.d; });
    return { all:all, ongoing:ongoing };
  }
  function renderDrives(){
    var el=document.getElementById('drivesBody'), t=addDays(nowNY(),0), dd=driveData(), ongoing=dd.ongoing;
    var up=dd.all.filter(function(x){ return x.d>=t; });    // already happened = off the strip
    function card(x){ var diff=Math.round((x.d-t)/864e5);
      var lbl=diff===0?'Today':(diff===1?'Tomorrow':DAYS[x.d.getDay()].slice(0,3)+' '+x.d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
      return '<div class="dc'+(diff===0?' today':'')+'"><span class="dd">'+esc(lbl)+'</span><span class="dg">'+esc(x.g)+'</span>'+
             '<span class="dt">'+esc(x.tm||'Time TBD')+(x.nt?' · '+esc(x.nt):'')+'</span></div>'; }
    var on=ongoing.length?'<div class="dc on"><span class="dd">Ongoing</span><span class="dg">'+ongoing.map(esc).join(' · ')+'</span></div>':'';
    if(!up.length&&!on){ el.innerHTML='<div class="empty">No food drives on the calendar.</div>'; return; }
    var size=window.innerHeight*0.024; el.style.fontSize=size+'px';
    // Never cut off a name: show the soonest drives that fit in full (the Ongoing card stays at the end).
    // A card is too tight if a word spills past its edge, or the cards get taller than the strip.
    function fits(){ var row=el.firstChild; if(el.scrollHeight>el.clientHeight+1) return false;
      var cs=row.children; for(var j=0;j<cs.length;j++){ if(cs[j].scrollWidth>cs[j].clientWidth+1||cs[j].scrollHeight>cs[j].clientHeight+1) return false; }
      return true; }
    // The strip is a fixed 3 x 2 grid, so fill every box (5 drives + Ongoing, or 6 drives if there's no Ongoing).
    // Removing a card doesn't make the others bigger, so shrink the text to fit first; drop a card only as a last resort.
    var n=Math.min(up.length, on?5:6);
    for(;;){
      el.innerHTML='<div class="drv">'+up.slice(0,n).map(card).join('')+on+'</div>';
      if(fits()) break;
      if(size>12){ size-=1; el.style.fontSize=size+'px'; continue; }
      if(n>1) { n--; continue; }
      break; }
  }

  // Shrink a quadrant's text until it fits, so long lists never get cut off.
  function fit(el){
    var mini=el.closest('.crew');   // the compact GAH / Bag Packers strip starts smaller
    var size=window.innerHeight*(mini?MINI_TEXT:0.028); el.style.fontSize=size+'px';
    while(el.scrollHeight>el.clientHeight+1 && size>11){ size-=1; el.style.fontSize=size+'px'; }
  }
  function renderAll(){
    renderAnn(); renderMenu(); renderShift(); renderGah(); renderBag();
    ['menuBody','shiftBody','gahBody','bagBody'].forEach(function(id){ fit(document.getElementById(id)); });
    renderDrives();
  }

  function tick(){
    var n=nowNY();
    document.getElementById('clock').textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    document.getElementById('today').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  }

  /* ===== load ===== */
  function get(gid){ return fetch(csvUrl(gid)).then(function(r){ if(!r.ok) throw 0; return r.text(); }); }
  function opt(gid){ if(!gid||gid.indexOf('PASTE')>-1) return Promise.resolve(''); return get(gid).catch(function(){ return ''; }); }
  function load(){
    var menuReq = (!MENU_SHEET_ID||MENU_SHEET_ID.indexOf('PASTE')>-1) ? Promise.resolve('')
      : fetch('https://docs.google.com/spreadsheets/d/'+MENU_SHEET_ID+'/export?format=csv&gid='+MENU_GID+'&t='+Date.now())
          .then(function(r){ return r.ok?r.text():''; }).catch(function(){ return ''; });
    var annReq = (!ANNOUNCEMENTS_SHEET_ID||ANNOUNCEMENTS_SHEET_ID.indexOf('PASTE')>-1) ? opt(ANNOUNCEMENTS_GID)
      : fetch('https://docs.google.com/spreadsheets/d/'+ANNOUNCEMENTS_SHEET_ID+'/export?format=csv&gid='+ANNOUNCEMENTS_GID+'&t='+Date.now())
          .then(function(r){ return r.ok?r.text():''; }).catch(function(){ return ''; });
    var drivesReq = (!ANNOUNCEMENTS_SHEET_ID||ANNOUNCEMENTS_SHEET_ID.indexOf('PASTE')>-1) ? Promise.resolve('')
      : fetch('https://docs.google.com/spreadsheets/d/'+ANNOUNCEMENTS_SHEET_ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(DRIVES_TAB)+'&t='+Date.now())
          .then(function(r){ return r.ok?r.text():''; }).catch(function(){ return ''; });
    Promise.all([get(SUPERVISORS_GID),get(SIGNUPS_GID),opt(BAGPACKERS_GID),opt(GAH_GID),annReq,menuReq,drivesReq])
      .then(function(res){
        sup=parseCSV(res[0]); sign=parseCSV(res[1]); bag=parseCSV(res[2]); gah=parseCSV(res[3]); ann=parseCSV(res[4]);
        if(res[5]) menu=parseCSV(res[5]);
        drives=parseCSV(res[6]||'');
        // If the Drives tab is missing, Google can hand back another tab instead; only use it if it has a Group column.
        if(!(drives[0]||[]).some(function(x){ return /group|who|org/i.test(String(x)); })) drives=[];
        renderAll();
      }).catch(function(){ if(!sup.length){ useSample(); } renderAll(); });
  }

  function useSample(){
    preview=true; document.getElementById('banner').style.display='block';
    var t=nowNY(), iso=(t.getMonth()+1)+'/'+t.getDate()+'/'+t.getFullYear();
    var nx=nextDay(function(x){ var w=x.getDay(); return w>=1&&w<=5; }), nxIso=(nx.getMonth()+1)+'/'+nx.getDate()+'/'+nx.getFullYear();
    sup=[['Day','Group','Name'],['Monday','','Joanne K.'],['Tuesday','Moms + Muscles','Cathi E.'],['Wednesday','','Virginia'],['Thursday','East Swamp','Joanne C.'],['Friday','','Kate']];
    sign=[['Timestamp','First','Last','Email','Phone','Date','Reason','Status'],
      ['','Kathy','R','','',nxIso,'',''],['','Sandy','V','','',nxIso,'',''],['','Carol','M','','',nxIso,'',''],['','Mary Ann','S','','',nxIso,'',''],['','Donna','S','','',nxIso,'','']];
    gah=[['GAH Driver Schedule'],['Store','Monday','Tuesday','Wednesday','Thursday','Friday'],
      ['Giant','Jim Smith','Nicole O.','Kaitlin','Donna & Claude',''],['Giant LOWES','Jim Smith','','','Donna & Claude','Alan G'],
      ['Target','Todd Benner','','Butch','','Ed Angelo'],['Walmart','Ed Angelo','Butch','','Clark',''],['Grocery Outlet','','Alicia D.','','','']];
    bag=[['Day','Week','Packer','Phone','Email','Backup'],
      ['Sunday','2nd','Bill Hahn','','',''],['Monday Evening','2nd','Jennie Becker','','',''],['Thursday Afternoon','3rd',"St. Paul's Church + Michelle",'','',''],
      ['Sunday','3rd','Mary Hill','','',''],['Monday Evening','3rd','Kate Caponear','','','']];
    ann=[['Message','Show from','Show until','QR'],['Sign up with this QR code to attend the Upper Bucks Chamber of Commerce Roast & Toast on Thursday at The Trolley Barn in Quakertown from 4:30 - 6:30 PM! All Quakertown Food Pantry volunteers are welcome at no cost! We\'ll be receiving the Champions of Service Award!','','','f7561f5e.png'],['Shift Supervisor Training: Wed Dec 2, 6-8 PM at John\'s Plain & Fancy','','','']];   // preview only
    var dv=function(n){ var x=addDays(t,n); return (x.getMonth()+1)+'/'+x.getDate()+'/'+x.getFullYear(); };   // preview only
    drives=[['Date','Group','Time'],[dv(2),'Girl Scouts','1:00 PM'],[dv(4),'Neidig Elementary','4:30 PM'],[dv(9),'Cops','1:00 PM'],
      [dv(11),'Quakertown School District',''],[dv(25),'Faith Christian','1:30 PM'],[dv(32),'Microsize','1:00 PM'],
      ['','Boxes at local businesses',''],['','Quilters',''],['','YMCA','']];
    menu=[['Category','Items','Notes'],
      ['Frozen','Chicken (1A), Ground meat, Frozen lunch item (#2, 3)',''],
      ['Canned Protein','Ham (D), Canned pasta (D)',''],
      ['Vegetables','Fed. peas, Fed. mixed veg, Canned potatoes (D), Pasta sauce (D)',''],
      ['Dry Goods','Rice (D), Spaghetti (D), Box of crackers, Misc dry (D)',''],
      ['Soup','S/F vegetable, Chunky or Progresso (D)',''],
      ['Fruit','Fed. peaches, Mandarin oranges (D)',''],
      ['Extras','Bread & dessert, Frozen extras, Milk & eggs, Misc items (1B), Snacks','Ask']];
  }

  /* ===== full schedule pop-up ===== */
  var sheet=document.getElementById('sheet'), closeTimer=null;
  function fmtD(d){ return DAYS[d.getDay()].slice(0,3)+', '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
  function rowCls(d){ var k=keyOf(d), t=keyOf(nowNY()); return k===t?'today':(k<t?'past':''); }
  // Label the row for today, the most recent past day ("Last"), and the next one coming up.
  function tagsFor(rows){
    var t=keyOf(nowNY()), tags=rows.map(function(){ return ''; }), hasToday=false, last=-1, next=-1;
    rows.forEach(function(r,i){ var k=keyOf(r.d);
      if(k===t){ tags[i]='Today'; hasToday=true; } else if(k<t) last=i; else if(next<0) next=i; });
    if(last>-1) tags[last]='Last';
    if(!hasToday&&next>-1) tags[next]='Next';
    return tags;
  }
  function tagHtml(t){ return t?'<span class="tag">'+t+'</span>':''; }
  function who(s){ return s?esc(shortName(s)):'<span class="open">Open</span>'; }

  // Calendar view: last week, this week, and the next 3 weeks (Sunday to Saturday).
  // cellFn(d) returns the inside of a day, or '' when nothing happens that day.
  function calendar(cellFn, note){
    var t=addDays(nowNY(),0), start=addDays(t,-t.getDay()-7), days=[];
    for(var n=0;n<35;n++){ var d=addDays(start,n); days.push({ d:d, body:cellFn(d) }); }
    var tags=tagsFor(days.filter(function(x){ return x.body; }));
    var ti=0, h='<p class="pnote">'+note+'</p><div class="cal">';
    DAYS.forEach(function(dn){ h+='<div class="dh">'+dn.slice(0,3)+'</div>'; });
    days.forEach(function(x,i){
      var tag=x.body?tags[ti++]:'', d=x.d;
      var lbl=(i===0||d.getDate()===1)?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):d.getDate();
      h+='<div class="cd '+rowCls(d)+(x.body?'':' none')+'"><div class="dn">'+lbl+tagHtml(tag==='Today'?'':tag)+'</div>'+(x.body||'')+'</div>';
    });
    return h+'</div>';
  }

  function fullBag(){
    return calendar(function(d){
      var w=d.getDay(); if(!(w===0||w===1||w===4)) return '';
      var p=packersOn(d)||{}, lbl=p.label&&p.label.indexOf(' ')>-1?p.label.split(' ').slice(1).join(' '):'';
      return (lbl?'<div class="tm">'+esc(lbl)+'</div>':'')+'<div class="ln"><b>'+who(p.packer)+'</b></div>'+
             (p.backup?'<div class="ln"><small>Backup: '+esc(shortName(p.backup))+'</small></div>':'');
    }, 'Last week, this week, and the next 3 weeks. Today is highlighted; grayed days have already happened.');
  }
  function fullShift(){
    return calendar(function(d){
      var w=d.getDay(); if(w<1||w>5) return '';
      var s=findSup(d), name=s?(s[2]||'').trim():'', grp=s?(s[1]||'').trim():'', names=signupsOn(d);
      return '<div class="tm">'+shiftTime(DAYS[w])+'</div>'+
             '<div class="ln"><small>Sup:</small> <b>'+who(name&&name!=='TBD'?name:'')+'</b></div>'+
             (grp&&grp!=='NA'?'<div class="ln grpd">'+esc(grp)+'</div>':'')+
             names.map(function(n){ return '<div class="ln">'+esc(shortName(n))+'</div>'; }).join('');
    }, 'Last week, this week, and the next 3 weeks. Today is highlighted; grayed days have already happened.');
  }
  function fullGah(){
    return calendar(function(d){
      var rows=gahOn(d).filter(function(r){ return r.driver; });
      if(!rows.length) return '';
      return rows.map(function(r){ return '<div class="ln"><small>'+esc(r.store)+':</small> <b>'+esc(shortName(r.driver))+'</b></div>'; }).join('');
    }, 'Weekly pickup schedule, shown for last week, this week, and the next 3 weeks. Today is highlighted.');
  }

  function fullDrives(){
    var dd=driveData(), t=addDays(nowNY(),0);
    // Past drives from the last 2 weeks stay listed (grayed) so you can see what just came in.
    var rows=dd.all.filter(function(x){ return x.d>=addDays(t,-14); }), tags=tagsFor(rows);
    var h='<p class="pnote">Every drive on the list, soonest first. Today is highlighted; grayed ones already happened and drop off after 2 weeks.</p>';
    h+= rows.length
      ? '<table class="sch"><tr><th>Date</th><th>Group</th><th>Time</th><th>Notes</th></tr>'+rows.map(function(x,i){
          return '<tr class="'+rowCls(x.d)+'"><td class="tc">'+esc(fmtD(x.d))+tagHtml(tags[i])+'</td><td><b>'+esc(x.g)+'</b></td><td>'+
                 esc(x.tm||'Time TBD')+'</td><td>'+(x.nt?esc(x.nt):'')+'</td></tr>'; }).join('')+'</table>'
      : '<p class="empty">No dated food drives on the list.</p>';
    if(dd.ongoing.length) h+='<p class="pnote" style="margin-top:1.4em"><b>Ongoing:</b> '+dd.ongoing.map(esc).join(' · ')+'</p>';
    return h;
  }

  var FULL={ shift:['c-shift','🥕 Pantry Shift Schedule',fullShift],
             menuNext:['c-menu','🍽️ Next Week\'s Menu',fullMenuNext],
             drives:['c-drives','🥫 Food Drives',fullDrives],
             gah:['c-gah','🚚 GAH Driver Schedule',fullGah],
             bag:['c-bag','🛍️ Bag Packer Schedule',fullBag] };
  function bump(){ clearTimeout(closeTimer); closeTimer=setTimeout(closeFull,90000); }   // auto-close after 90s idle
  function closeFull(){ sheet.classList.remove('show'); clearTimeout(closeTimer); }
  function openFull(k){
    var f=FULL[k];
    document.getElementById('panel').className='panel '+f[0];
    document.getElementById('sheetTitle').textContent=f[1];
    var b=document.getElementById('sheetBody'); b.innerHTML=f[2](); b.scrollTop=0;
    sheet.classList.add('show'); bump();
  }
  ['shift','gah','bag','drives'].forEach(function(k){
    document.querySelector('[data-full="'+k+'"]').addEventListener('click',function(){ openFull(k); });
  });
  document.getElementById('menuNext').addEventListener('click',function(e){ e.stopPropagation(); openFull('menuNext'); });
  document.getElementById('sheetClose').addEventListener('click',function(e){ e.stopPropagation(); closeFull(); });
  sheet.addEventListener('click',function(e){ if(e.target===sheet) closeFull(); else bump(); });
  sheet.addEventListener('touchstart',bump,{passive:true});
  document.getElementById('sheetBody').addEventListener('scroll',bump);

  /* ===== night mode ===== */
  var night=document.getElementById('night'), saver=document.getElementById('saver'), wakeUntil=0, saverOn=false;
  function isNight(){
    var h=nowNY().getHours();
    return NIGHT_OFF_HOUR>NIGHT_ON_HOUR ? (h>=NIGHT_OFF_HOUR||h<NIGHT_ON_HOUR) : (h>=NIGHT_OFF_HOUR&&h<NIGHT_ON_HOUR);
  }
  // Add ?saver to the address (board.html?saver) to preview the screensaver during the day.
  var FORCE_SAVER=/[?&]saver\b/.test(location.search);
  function nightCheck(){
    var on=((NIGHT_MODE&&isNight())||FORCE_SAVER) && Date.now()>wakeUntil;
    if(on && sheet.classList.contains('show')) closeFull();
    night.classList.toggle('show',on);
    if(on && !saverOn){ saverOn=true; saverText(); requestAnimationFrame(drift); }
    if(!on) saverOn=false;
  }

  /* ===== end-of-day screensaver ===== */
  var sIdx=0, sx=null, sy=0, vx=SAVER_SPEED, vy=SAVER_SPEED*0.7, lastT=0;
  // Next pantry shift: after the evening it's tomorrow; in the early morning it's today.
  function nextShiftLine(){
    var start=nowNY().getHours()<NIGHT_ON_HOUR?0:1;
    for(var n=start;n<start+8;n++){ var d=addDays(nowNY(),n), w=d.getDay();
      if(w>=1&&w<=5) return 'Next open: '+whenLabel(d)+' · '+shiftTime(DAYS[w]); }
    return '';
  }
  function saverText(){
    var m=document.getElementById('smsg');
    m.classList.add('fade');
    setTimeout(function(){ m.textContent=SAVER_MESSAGES[sIdx%SAVER_MESSAGES.length]; m.classList.remove('fade'); },800);
    document.getElementById('snext').textContent=nextShiftLine();
  }
  setInterval(function(){ if(saverOn){ sIdx++; saverText(); } },SAVER_MSG_SEC*1000);
  setInterval(function(){ if(saverOn) document.getElementById('sclock').textContent=nowNY().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); },1000);
  function drift(t){
    if(!saverOn) return;
    var dt=lastT?Math.min(.1,(t-lastT)/1000):0; lastT=t;
    var maxX=window.innerWidth-saver.offsetWidth, maxY=window.innerHeight-saver.offsetHeight;
    if(sx===null){ sx=Math.random()*Math.max(0,maxX); sy=Math.random()*Math.max(0,maxY); }
    sx+=vx*dt; sy+=vy*dt;
    if(sx<0){ sx=0; vx=Math.abs(vx); } if(sx>maxX){ sx=Math.max(0,maxX); vx=-Math.abs(vx); }
    if(sy<0){ sy=0; vy=Math.abs(vy); } if(sy>maxY){ sy=Math.max(0,maxY); vy=-Math.abs(vy); }
    saver.style.transform='translate('+sx+'px,'+sy+'px)';
    requestAnimationFrame(drift);
  }
  night.addEventListener('click',function(){ wakeUntil=Date.now()+WAKE_MIN*60000; nightCheck(); });
  nightCheck(); setInterval(nightCheck,30000);

  /* ===== keep the screen awake ===== */
  // Asks Chrome to stop Windows from turning the display off while this page is showing.
  // The lock drops when the page is hidden, so it's re-requested whenever the board comes back.
  var wakeLock=null;
  function keepAwake(){
    if(!('wakeLock' in navigator) || document.visibilityState!=='visible') return;
    navigator.wakeLock.request('screen').then(function(l){ wakeLock=l; l.addEventListener('release',function(){ wakeLock=null; }); }).catch(function(){});
  }
  document.addEventListener('visibilitychange',function(){ if(!wakeLock) keepAwake(); });
  keepAwake(); setInterval(function(){ if(!wakeLock) keepAwake(); },60000);

  /* ===== pixel shift ===== */
  function pixelShift(){
    var x=Math.round((Math.random()*2-1)*SHIFT_PX), y=Math.round((Math.random()*2-1)*SHIFT_PX);
    ['.top','.quad','.foot'].forEach(function(s){ document.querySelector(s).style.transform='translate('+x+'px,'+y+'px)'; });
  }
  setInterval(pixelShift,SHIFT_EVERY_MIN*60000);

  tick(); setInterval(tick,1000);
  load(); setInterval(load,REFRESH_MIN*60000);
  window.addEventListener('resize',renderAll);
  // Start fresh each morning
  var startKey=keyOf(nowNY());
  setInterval(function(){ if(keyOf(nowNY())!==startKey) safeReload(); },60000);
  // Hourly full reload. Waits if someone has a schedule open, and only reloads when the
  // website is reachable, so a WiFi blip never leaves the board stuck on an error page.
  var pageStart=Date.now();
  setInterval(function(){
    if(Date.now()-pageStart<PAGE_RELOAD_MIN*60000) return;
    if(sheet.classList.contains('show')) return;
    safeReload();
  },60000);
  function safeReload(){
    fetch(location.href.split('#')[0]+(location.search?'&':'?')+'ping='+Date.now(),{cache:'no-store'})
      .then(function(r){ if(r.ok) location.reload(); })
      .catch(function(){});
  }
})();
</script>
